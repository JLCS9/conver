# Converflow production stack.
#
# Only the Next.js backend runs in docker. SSL termination and HTTP/HTTPS
# routing are handled by the host nginx (already running on this VPS for
# other projects), which proxies api.converflow.tech to this backend on
# 127.0.0.1:8082. See scripts/nginx-api.converflow.tech.conf for the vhost.
#
# Deploy on the VPS:
#   cd /opt/converflow && ./scripts/deploy.sh
#
# Logs:
#   docker compose logs -f backend

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: converflow-backend:latest
    container_name: converflow-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.local
    # Bind only to localhost — public traffic comes through host nginx.
    ports:
      - "127.0.0.1:8082:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  voice-gateway:
    build:
      context: ./voice-gateway
      dockerfile: Dockerfile
    image: converflow-voice-gateway:latest
    container_name: converflow-voice-gateway
    restart: unless-stopped
    # Reuses the same env_file as backend — GEMINI_*, CLERK_SECRET_KEY,
    # SUPABASE_* are shared across services. No secret duplication.
    env_file:
      - ./backend/.env.local
    # Bind only to localhost — host nginx fronts /voice → 8083.
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
