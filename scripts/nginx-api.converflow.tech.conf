# nginx vhost for the Converflow backend.
#
# Install:
#   sudo cp /opt/converflow/scripts/nginx-api.converflow.tech.conf \
#          /etc/nginx/sites-available/api.converflow.tech
#   sudo ln -sf /etc/nginx/sites-available/api.converflow.tech \
#               /etc/nginx/sites-enabled/api.converflow.tech
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get SSL (certbot auto-modifies this file to add a 443 block):
#   sudo apt install certbot python3-certbot-nginx -y
#   sudo certbot --nginx -d api.converflow.tech --redirect --agree-tos -m jose@csodigital.tech -n
#
# Renewal is handled by certbot's systemd timer (certbot.timer).

server {
    listen 80;
    listen [::]:80;
    server_name api.converflow.tech;

    # Reasonable upload limits (we mostly POST small JSON; audio uses WS).
    client_max_body_size 4M;

    # WebSocket support (Gemini Live + future Pipecat will use WS).
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        # WebSocket upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward client info.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Don't buffer streaming responses (SSE, long polls, WS).
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # Long timeouts for voice sessions (12 min max + slack).
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Light access log; tweak path to match your nginx convention if needed.
    access_log /var/log/nginx/api.converflow.tech.access.log;
    error_log  /var/log/nginx/api.converflow.tech.error.log warn;
}
