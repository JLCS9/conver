# nginx vhost for the Converflow backend.
#
# ============================================================
# Lifecycle / how to use this file
# ============================================================
#
# This template now includes BOTH the :80 redirect block AND the :443 TLS
# block. The :443 block references certbot's standard cert paths, which
# are stable once provisioned. That way, when we add routes to the vhost
# (e.g. /voice landed in Week 3 Day 1), we can copy this file straight
# over the live config without losing the SSL config — fixing the
# regression that bit us on the first voice-gateway deploy.
#
# First-time install on a fresh VPS (no cert yet):
#
#   1. Comment out the entire `server { listen 443 ssl; ... }` block
#      below — nginx -t will fail without the cert files existing.
#   2. Copy + enable + reload:
#        sudo cp /opt/converflow/scripts/nginx-api.converflow.tech.conf \
#                /etc/nginx/sites-available/api.converflow.tech
#        sudo ln -sf /etc/nginx/sites-available/api.converflow.tech \
#                    /etc/nginx/sites-enabled/api.converflow.tech
#        sudo nginx -t && sudo systemctl reload nginx
#   3. Provision the cert:
#        sudo apt install certbot python3-certbot-nginx -y
#        sudo certbot --nginx -d api.converflow.tech --redirect \
#                     --agree-tos -m jose@csodigital.tech -n
#   4. Un-comment the :443 block, copy the file again, reload nginx.
#
# Subsequent updates (cert already exists):
#
#   sudo cp /opt/converflow/scripts/nginx-api.converflow.tech.conf \
#           /etc/nginx/sites-available/api.converflow.tech
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cert renewals: certbot.timer handles them — no manual action.

# ----- :80 → :443 redirect -----
server {
    listen 80;
    listen [::]:80;
    server_name api.converflow.tech;

    if ($host = api.converflow.tech) {
        return 301 https://$host$request_uri;
    }

    return 404;
}

# ----- :443 with TLS, proxies to backend + voice-gateway -----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2 INTENTIONALLY DISABLED on this vhost.
    # WebSocket over HTTP/2 (RFC 8441) requires both the client and the
    # server proxy chain to negotiate Extended CONNECT. nginx does NOT
    # bridge HTTP/2 :protocol=websocket → HTTP/1.1 backend upgrade cleanly
    # in our 1.27 build, and React Native's iOS WebSocket
    # (NSURLSessionWebSocketTask) tries HTTP/2 by default when ALPN
    # advertises it — handshake fails silently with close code 0 on the
    # client side, and nothing reaches our gateway. Disabling http2
    # forces ALPN to negotiate http/1.1, which fixes WebSocket without
    # any client change. /api/* HTTP perf cost is negligible at our scale.
    server_name api.converflow.tech;

    # Cert paths managed by certbot — stable across renewals.
    ssl_certificate     /etc/letsencrypt/live/api.converflow.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.converflow.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Reasonable upload limits (we mostly POST small JSON; audio uses WS).
    client_max_body_size 4M;

    # WebSocket-only path served by the voice-gateway container on 8083.
    # Must come BEFORE the catch-all `location /` so it wins precedence.
    # nginx matches prefixes in order; first match wins for a literal prefix.
    location /voice {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;

        # WebSocket upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward client info — the gateway uses X-Forwarded-For for rate-
        # limiting and audit logs.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Streaming → no buffering.
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # 12-minute hard-cap sessions need ≥720s; add slack for graceful close.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 30s;
    }

    # Everything else goes to the Next.js backend (HTTP only on this path).
    # WS upgrade headers preserved here too for future routes that need them.
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        # WebSocket upgrade (kept for parity; no current backend WS routes).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward client info.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Don't buffer streaming responses (SSE, long polls).
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # Long timeouts for any future streaming HTTP.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /var/log/nginx/api.converflow.tech.access.log;
    error_log  /var/log/nginx/api.converflow.tech.error.log warn;
}
